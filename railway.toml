# Railway deployment config for VerdictAI backend.
#
# Railway auto-detects Python from requirements.txt and builds with
# Nixpacks. We pin the system packages that our OCR + PDF pipeline
# needs (Tesseract, Poppler, OpenCV runtime deps).

[build]
builder = "nixpacks"

[build.nixpacksPlan.phases.setup]
aptPkgs = [
  "tesseract-ocr",
  "tesseract-ocr-eng",
  "poppler-utils",
  "libgl1",
  "libglib2.0-0",
  "libsm6",
  "libxext6",
  "libxrender1",
]

[deploy]
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
